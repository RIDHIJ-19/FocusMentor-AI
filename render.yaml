services:
  - type: web
    name: focusmentor-ai
    runtime: python
    plan: free
    buildCommand: pip install -r web/requirements.txt
    startCommand: python -m uvicorn web.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
